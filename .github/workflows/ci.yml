name: ci

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Model, circuit (noir_wasm + bb.js), attestor, Foundry (npm forge + solc-js), portal, evaluation tests.
      - run: bash scripts/e2e-pipeline.sh
      - name: Generated files are up to date
        run: git diff --exit-code -- circuits contracts/src/HonkVerifier.sol
